<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuestas y Masterclass — Ceprocenter</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fb; --card:#fff; --ink:#1b2033; --muted:#6b7288; --line:#e3e7f0;
    --brand:#2b3a8f; --brand2:#4a5fd1; --soft:#eef1ff; --ok:#1f9d62; --okbg:#e7f7ef;
    --warn:#c0392b; --warnbg:#fdecea; --amberbg:#fff6e5; --amber:#9a6200;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
  .wrap.ancho{max-width:960px}
  .marca{font-weight:800;letter-spacing:.04em;color:var(--brand);font-size:13px;text-transform:uppercase}
  h1{font-size:24px;margin:6px 0 4px;line-height:1.25}
  h2{font-size:18px;margin:0 0 4px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
  .hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:none}
  .hero .marca{color:#cdd5ff}
  .hero .meta{display:grid;gap:4px;margin-top:12px;font-size:14px}
  .hero .meta b{color:#fff}
  .hero .meta span{color:#dfe4ff}
  .q{padding:14px 0;border-top:1px solid var(--line)}
  .q:first-of-type{border-top:none}
  .q.falta .qt{color:var(--warn)}
  .q.falta .escala .opt{border-color:#f1b0a8}
  .qt{font-weight:600;margin-bottom:8px}
  .escala{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .lista{display:grid;gap:8px}
  .opt.txt{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 14px;font-weight:600}
  .opt.txt .punto{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;background:#fff}
  .opt.txt.sel .punto{border-color:#fff;box-shadow:inset 0 0 0 4px var(--brand)}
  .q.falta .lista .opt{border-color:#f1b0a8}
  .escala.nps{grid-template-columns:repeat(11,1fr);gap:4px}
  .opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 0;font:inherit;font-weight:700;cursor:pointer;color:var(--ink);transition:.12s}
  .opt:hover{border-color:var(--brand2)}
  .opt.sel{background:var(--brand);border-color:var(--brand);color:#fff}
  .escala.nps .opt{padding:9px 0;font-size:13px;border-radius:8px}
  .leyenda{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
  textarea,input,select{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
  textarea{min-height:84px;resize:vertical}
  textarea.corto{min-height:56px}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--brand2)}
  label.lbl{display:block;font-weight:600;margin:14px 0 6px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
  .btn:disabled{opacity:.6;cursor:wait}
  .btn.full{width:100%;padding:15px}
  .btn.sec{background:var(--soft);color:var(--brand)}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.wa{background:#1fa855}
  .btn.sm{padding:8px 12px;font-size:13px}
  .msg{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px}
  .msg.err{background:var(--warnbg);color:var(--warn)}
  .msg.ok{background:var(--okbg);color:var(--ok)}
  .msg.info{background:var(--soft);color:var(--brand)}
  .msg.aviso{background:var(--amberbg);color:var(--amber)}
  .centro{text-align:center;padding:48px 20px}
  .emoji{font-size:48px}
  .spinner{width:34px;height:34px;border:4px solid var(--soft);border-top-color:var(--brand);border-radius:50%;animation:g 1s linear infinite;margin:0 auto}
  @keyframes g{to{transform:rotate(360deg)}}
  .tabs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .tab{padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer}
  .tab.act{background:var(--brand);color:#fff;border-color:var(--brand)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg .opt{font-weight:600}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--brand)}
  .chip.ok{background:var(--okbg);color:var(--ok)}
  .chip.off{background:#eceef3;color:var(--muted)}
  .chip.warn{background:var(--warnbg);color:var(--warn)}
  .barra{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:4px}
  .barra i{display:block;height:100%;background:var(--brand2);border-radius:999px}
  .pr{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;padding:7px 0;font-size:14px}
  .pr b{text-align:right}
  .coment{border-top:1px solid var(--line);padding:12px 0;font-size:14px}
  .coment p{margin:4px 0}
  .detalle{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .grande{font-size:28px;font-weight:800;color:var(--brand)}
  .resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:8px}
  .resumen .card{margin:0;padding:14px;text-align:center}
  .link{background:none;border:none;color:var(--brand2);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
  #gbtn{display:flex;justify-content:center;min-height:44px;margin:18px 0 6px}
  table.tabla{width:100%;border-collapse:collapse;font-size:13px}
  table.tabla th{text-align:left;color:var(--muted);padding:6px 4px;font-weight:600}
  table.tabla td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
  table.tabla td:first-child{white-space:nowrap}
  .progreso{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:14px}
  .progreso i{display:block;height:100%;width:0;background:var(--brand2);border-radius:999px;transition:width .35s}
  .pregunta{padding:24px 20px}
  .ptexto{font-size:21px;line-height:1.3;margin:6px 0 4px}
  .estrellas{display:flex;justify-content:center;gap:6px;margin:18px 0 4px}
  .estrella{background:none;border:none;font-size:46px;line-height:1;color:#d7dbe6;cursor:pointer;padding:2px;transition:transform .12s,color .12s}
  .estrella.on{color:#f5b301}
  .estrella:active{transform:scale(1.15)}
  .etq{text-align:center;font-weight:700;color:var(--brand);min-height:22px}
  .mejorar{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .chips-sel{display:flex;flex-wrap:wrap;gap:8px}
  .chipsel{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
  .chipsel.sel{background:#fdecea;border-color:#e8a29b;color:var(--warn)}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
  .nav .btn:disabled{opacity:.45;cursor:not-allowed}
  .contador{margin-top:6px;text-align:right}
  .yo{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:0 4px}
  .anim{animation:entra .28s ease}
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .doc-fila{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .doc-nota{text-align:right;flex:none}
  .stars{position:relative;display:inline-block;line-height:1;letter-spacing:1px}
  .stars-bg{color:#d7dbe6}
  .stars-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#f5b301}
  .dist{display:grid;grid-template-columns:40px 1fr 34px;gap:10px;align-items:center;font-size:14px;padding:3px 0}
  .dist .barra{margin:0}
  .dist b{text-align:right}
  .grafico{display:flex;gap:8px;margin-top:8px;height:200px}
  .ejes{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);padding:18px 0 22px;text-align:right}
  .barras{flex:1;display:flex;gap:6px;align-items:stretch;border-left:1px solid var(--line);padding-left:6px;overflow:visible}
  .ejes span{line-height:0}
  .col{position:relative;flex:1;min-width:18px;max-width:64px;display:flex;flex-direction:column;align-items:center;outline:none;cursor:default}
  .col .val{font-size:12px;font-weight:700;height:18px}
  .col .pista{flex:1;width:60%;display:flex;align-items:flex-end;border-bottom:1px solid var(--line)}
  .col .pista i{display:block;width:100%;background:var(--brand2);border-radius:4px 4px 0 0;min-height:2px}
  .col .et{font-size:11px;color:var(--muted);height:22px;padding-top:4px}
  .col .tip{display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;
    padding:8px 10px;border-radius:8px;width:max-content;max-width:240px;z-index:5;pointer-events:none}
  .col:hover .tip,.col:focus .tip{display:block}
  .col:hover .pista i,.col:focus .pista i{background:var(--brand)}
  .doc-botones{display:flex;flex-wrap:wrap;gap:8px}
  .doc-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1.5px solid var(--line);background:#fff;border-radius:12px;
    padding:10px 14px;font:inherit;cursor:pointer;color:var(--ink);text-align:left}
  .doc-btn span{font-size:12px;color:var(--muted)}
  .doc-btn:hover{border-color:var(--brand2)}
  .doc-btn.sel{background:var(--brand);border-color:var(--brand);color:#fff}
  .doc-btn.sel span{color:#dfe4ff}
  .parte-et{font-size:13px;font-weight:700;color:var(--brand)}
  .parte-n{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 8px;margin-right:4px;font-size:12px}
  .mc-check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;margin-top:10px;font-size:14px}
  .mc-check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--brand)}
  .mc-check a{color:var(--brand2)}
  .mc-grupo{margin-top:18px;background:#e9f8ef;border:1.5px solid #b9e6cb;border-radius:14px;padding:16px;text-align:left}
  .mc-grupo-t{font-weight:800;color:#147a3f;font-size:16px}
  a.btn{text-decoration:none}
  .mc-preview{margin-top:10px;background:var(--soft);border-radius:10px;padding:12px;text-align:center}
  .mc-preview-nom{font-size:19px;font-weight:800;margin-top:4px;min-height:24px}
  @media (max-width:560px){
    .fila{grid-template-columns:1fr}
    .escala.nps{grid-template-columns:repeat(6,1fr);gap:6px}
    h1{font-size:21px}
  }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
// ⚠️ Pega aquí la MISMA URL de Apps Script que usan Matrículas y Calificaciones (termina en /exec).
// (El ID de cliente de Google NO va aquí: la página lo toma del Apps Script.)
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzSocYjhrj1F0wvNecAnGeepxsP_jie58658PL-jnQXtiVqqAT7283HpXWRs7HOWkNJ/exec';

const EQUIPO = ['Kin', 'Jose', 'Sara'];
const params = new URLSearchParams(location.search);
const ENC_ID = params.get('id');
const $app = document.getElementById('app');

async function api(payload) {
  const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
  return r.json();
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function cargando(texto) {
  return '<div class="card centro"><div class="spinner"></div><p class="muted">' + esc(texto || 'Cargando…') + '</p></div>';
}
function linkEncuesta(id) { return location.origin + location.pathname + '?id=' + encodeURIComponent(id); }
function fmt(n) { return n == null ? '—' : Number(n).toFixed(1); }

/* =========================================================================
   MODO ESTUDIANTE  (encuestas.html?id=XXXX)
   Encuesta interactiva: una pregunta por pantalla, avanza sola al tocar.
   ========================================================================= */
let ENC = null;
let IDENT = null;            // { correo, nombre, firma }
let PASO = 0;
const RESP = {};             // key -> valor
const MEJ = {};              // key de "mejorar" -> [opciones elegidas]
const CLAVE_IDENT = 'cpc_cuenta_google';
let avanceTimer = null;

function leerIdent() { try { return JSON.parse(localStorage.getItem(CLAVE_IDENT) || 'null'); } catch (e) { return null; } }
function guardarIdent(o) { try { localStorage.setItem(CLAVE_IDENT, JSON.stringify(o)); } catch (e) {} }
function borrarIdent() { try { localStorage.removeItem(CLAVE_IDENT); } catch (e) {} }

// Navegadores dentro de apps (Instagram, Facebook, etc.) no permiten entrar con Google.
function esNavegadorDeApp() { return /FBAN|FBAV|Instagram|Line\/|TikTok|Snapchat/i.test(navigator.userAgent || ''); }

function cabeceraHTML() {
  const e = ENC.encuesta;
  return '<div class="card hero"><div class="marca">Ceprocenter · Encuesta de satisfacción</div>' +
    '<h1>' + esc(e.modulo) + '</h1>' +
    '<div class="meta"><div><span>Curso:</span> <b>' + esc(e.curso) + '</b></div>' +
    '<div><span>Docente:</span> <b>' + esc(e.tutor) + '</b></div>' +
    '<div><span>Modalidad:</span> <b>' + esc(e.modalidad) + '</b></div></div></div>';
}

async function iniciarEncuesta() {
  document.title = 'Encuesta — Ceprocenter';
  $app.innerHTML = cargando('Cargando encuesta…');
  const guardada = leerIdent();
  try {
    const res = await api({ action: 'obtenerEncuesta', id: ENC_ID, correo: guardada && guardada.correo, firma: guardada && guardada.firma });
    if (res.error) {
      $app.innerHTML = '<div class="card centro"><div class="emoji">' + (res.cerrada ? '🔒' : '🔎') + '</div><h2>' + esc(res.error) + '</h2></div>';
      return;
    }
    ENC = res;
    if (res.identidad) {
      IDENT = { correo: res.identidad.correo, firma: res.identidad.firma, nombre: (guardada && guardada.nombre) || res.identidad.correo };
      if (res.identidad.yaRespondio) return pantallaGracias(true);
      return empezarEncuesta();
    }
    if (guardada) borrarIdent();
    renderIdentificacion();
  } catch (e) {
    $app.innerHTML = '<div class="card centro"><div class="emoji">📶</div><h2>No pudimos cargar la encuesta</h2><p class="muted">Revisa tu conexión e inténtalo de nuevo.</p><button class="btn" onclick="iniciarEncuesta()">Reintentar</button></div>';
  }
}

/* ---------- Entrar con Google ---------- */

function renderIdentificacion(mensaje) {
  IDENT = null;
  $app.innerHTML = cabeceraHTML() +
    '<div class="card" style="text-align:center">' +
      '<h2>Para comenzar, entra con tu cuenta de Google</h2>' +
      '<p class="muted small" style="margin:4px 0 0">Toca el botón y elige la cuenta de Gmail de tu dispositivo. Te tomará un par de minutos.</p>' +
      (esNavegadorDeApp() ? '<div class="msg aviso">Estás abriendo el enlace dentro de una app. Para entrar con Google, ábrelo en <b>Chrome</b> o <b>Safari</b> (menú ⋮ o ··· → "Abrir en el navegador").</div>' : '') +
      '<div id="gbtn"></div>' +
      '<div id="errIdent">' + (mensaje ? '<div class="msg err">' + esc(mensaje) + '</div>' : '') + '</div>' +
    '</div>';
  esperarGoogle(ok => {
    if (!ok) {
      document.getElementById('errIdent').innerHTML = '<div class="msg err">No se pudo cargar el inicio de sesión de Google. Abre el enlace en Chrome o Safari e inténtalo de nuevo.</div>';
      return;
    }
    google.accounts.id.initialize({
      client_id: ENC.googleClientId,
      callback: alEntrarConGoogle,
      auto_select: true,
      cancel_on_tap_outside: false,
      itp_support: true,
      use_fedcm_for_prompt: true,
      context: 'use'
    });
    const ancho = Math.min(320, document.getElementById('gbtn').offsetWidth || 300);
    google.accounts.id.renderButton(document.getElementById('gbtn'), {
      theme: 'filled_blue', size: 'large', text: 'continue_with', shape: 'pill', locale: 'es', width: ancho
    });
    google.accounts.id.prompt(); // muestra la cuenta del dispositivo para entrar con un toque
  });
}

function esperarGoogle(cb, intentos) {
  intentos = intentos || 0;
  if (window.google && google.accounts && google.accounts.id) return cb(true);
  if (intentos > 80) return cb(false); // ~8 segundos
  setTimeout(() => esperarGoogle(cb, intentos + 1), 100);
}

async function alEntrarConGoogle(respuestaGoogle) {
  const $err = document.getElementById('errIdent');
  if ($err) $err.innerHTML = '<div class="msg info">Verificando tu cuenta…</div>';
  try {
    const res = await api({ action: 'identificarConGoogle', id: ENC_ID, credential: respuestaGoogle.credential });
    if (res.error) { if ($err) $err.innerHTML = '<div class="msg err">' + esc(res.error) + '</div>'; return; }
    IDENT = { correo: res.correo, nombre: res.nombre, firma: res.firma };
    guardarIdent(IDENT);
    if (res.yaRespondio) return pantallaGracias(true);
    empezarEncuesta();
  } catch (e) {
    if ($err) $err.innerHTML = '<div class="msg err">No pudimos verificar tu cuenta. Revisa tu conexión e inténtalo de nuevo.</div>';
  }
}

function usarOtraCuenta() {
  borrarIdent();
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  renderIdentificacion();
}

/* ---------- Encuesta paso a paso ---------- */

function empezarEncuesta() {
  $app.innerHTML = cabeceraHTML() +
    '<div class="yo small"><span>Respondiendo como <b>' + esc(IDENT.nombre) + '</b>' +
      (IDENT.nombre !== IDENT.correo ? ' <span class="muted">(' + esc(IDENT.correo) + ')</span>' : '') + '</span>' +
      '<button class="link small" id="btnOtra">Usar otra cuenta</button></div>' +
    '<div class="progreso"><i id="barra"></i></div>' +
    '<div id="paso"></div>';
  document.getElementById('btnOtra').addEventListener('click', usarOtraCuenta);
  mostrarPaso(PASO);
}

function pasoCompleto(p) {
  if (p.tipo === 'texto') return String(RESP[p.key] || '').trim().length >= (p.minimo || 1);
  if (RESP[p.key] === undefined) return false;
  if (p.mejorar && RESP[p.key] <= (p.umbral || 3)) return (MEJ[p.mejorar.key] || []).length > 0;
  return true;
}

let PARTES = [];

function mostrarPaso(i) {
  clearTimeout(avanceTimer);
  PARTES = ENC.preguntas.map(x => x.parte).filter((x, k, a) => a.indexOf(x) === k);
  PASO = i;
  const P = ENC.preguntas, p = P[i], total = P.length, ultimo = i === total - 1;
  document.getElementById('barra').style.width = Math.round(i / total * 100) + '%';

  let h = '<div class="card pregunta anim">' +
    '<div class="parte-et"><span class="parte-n">Parte ' + (PARTES.indexOf(p.parte) + 1) + ' de ' + PARTES.length + '</span> ' + esc(p.parte) +
      ' <span class="muted">· Pregunta ' + (i + 1) + ' de ' + total + '</span></div>' +
    '<h2 class="ptexto">' + esc(p.texto) + '</h2>' +
    (p.ayuda ? '<p class="muted small" style="margin:0 0 6px">' + esc(p.ayuda) + '</p>' : '');

  if (p.tipo === 'estrellas') {
    h += '<div class="estrellas">';
    for (let v = 1; v <= 5; v++) h += '<button type="button" class="estrella" data-v="' + v + '" aria-label="' + v + ' de 5">★</button>';
    h += '</div><div class="etq" id="etq">' + (RESP[p.key] ? esc(ENC.etiquetasEstrellas[RESP[p.key] - 1]) : 'Toca las estrellas') + '</div>';
  } else if (p.tipo === 'opciones') {
    h += '<div class="lista">' + p.opciones.map(o =>
      '<button type="button" class="opt txt" data-v="' + o.v + '"><span class="punto"></span>' + esc(o.t) + '</button>').join('') + '</div>';
  } else if (p.tipo === 'nps') {
    h += '<div class="escala nps">';
    for (let v = 0; v <= 10; v++) h += '<button type="button" class="opt" data-v="' + v + '">' + v + '</button>';
    h += '</div><div class="leyenda"><span>0 · Nada probable</span><span>10 · Muy probable</span></div>';
  } else if (p.tipo === 'texto') {
    h += '<textarea id="txt" maxlength="3000"' + (p.corto ? ' class="corto"' : '') + ' placeholder="' + esc(p.placeholder || 'Escribe aquí…') + '">' + esc(RESP[p.key] || '') + '</textarea>' +
      '<div class="contador muted small" id="contador"></div>';
  }

  if (p.mejorar) {
    h += '<div id="mejorar" class="mejorar" style="display:none"><div class="qt">' + esc(p.mejorar.texto) + '</div>' +
      '<p class="muted small" style="margin:-4px 0 8px">Puedes elegir varias.</p><div class="chips-sel">' +
      p.mejorar.opciones.map(o => '<button type="button" class="chipsel" data-o="' + esc(o) + '">' + esc(o) + '</button>').join('') +
      '</div></div>';
  }

  h += '<div id="errEnc"></div><div class="nav">' +
    (i > 0 ? '<button class="btn ghost" id="btnAtras">← Atrás</button>' : '<span></span>') +
    '<button class="btn" id="btnSig">' + (ultimo ? 'Enviar mis respuestas' : 'Siguiente →') + '</button></div></div>';

  const cont = document.getElementById('paso');
  cont.innerHTML = h;
  const $sig = document.getElementById('btnSig');
  const refrescar = () => { $sig.disabled = !pasoCompleto(p); };

  if (i > 0) document.getElementById('btnAtras').onclick = () => mostrarPaso(i - 1);
  $sig.onclick = () => { if (!pasoCompleto(p)) return; ultimo ? enviarEncuesta() : mostrarPaso(i + 1); };

  // Si la respuesta vale 3 o menos, aparece "¿qué falló?" y hay que marcar al menos una opción.
  const mostrarMejorar = () => {
    const m = document.getElementById('mejorar');
    if (!m) return;
    const bajo = RESP[p.key] !== undefined && RESP[p.key] <= (p.umbral || 3);
    const antes = m.style.display;
    m.style.display = bajo ? 'block' : 'none';
    if (bajo && antes === 'none') setTimeout(() => m.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
  };
  if (p.mejorar) {
    cont.querySelectorAll('.chipsel').forEach(c => {
      c.classList.toggle('sel', (MEJ[p.mejorar.key] || []).indexOf(c.dataset.o) !== -1);
      c.onclick = () => {
        const lista = MEJ[p.mejorar.key] = MEJ[p.mejorar.key] || [];
        const k = lista.indexOf(c.dataset.o);
        if (k === -1) lista.push(c.dataset.o); else lista.splice(k, 1);
        c.classList.toggle('sel', k === -1);
        refrescar();
      };
    });
  }
  mostrarMejorar();

  if (p.tipo === 'estrellas') {
    const pintar = v => cont.querySelectorAll('.estrella').forEach(b => b.classList.toggle('on', Number(b.dataset.v) <= v));
    pintar(RESP[p.key] || 0);
    cont.querySelectorAll('.estrella').forEach(b => {
      b.onmouseenter = () => pintar(Number(b.dataset.v));
      b.onmouseleave = () => pintar(RESP[p.key] || 0);
      b.onclick = () => {
        const v = Number(b.dataset.v);
        RESP[p.key] = v; pintar(v);
        document.getElementById('etq').textContent = ENC.etiquetasEstrellas[v - 1];
        if (p.mejorar && v > (p.umbral || 3)) MEJ[p.mejorar.key] = [];
        mostrarMejorar(); refrescar();
        if (!p.mejorar || v > (p.umbral || 3)) avanceTimer = setTimeout(() => mostrarPaso(i + 1), 450);
      };
    });
  } else if (p.tipo === 'opciones' || p.tipo === 'nps') {
    cont.querySelectorAll('.opt').forEach(b => {
      b.classList.toggle('sel', RESP[p.key] !== undefined && Number(b.dataset.v) === RESP[p.key]);
      b.onclick = () => {
        clearTimeout(avanceTimer);
        const v = Number(b.dataset.v);
        RESP[p.key] = v;
        cont.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b));
        if (p.mejorar && v > (p.umbral || 3)) MEJ[p.mejorar.key] = [];
        if (p.mejorar) cont.querySelectorAll('.chipsel').forEach(c => c.classList.toggle('sel', (MEJ[p.mejorar.key] || []).indexOf(c.dataset.o) !== -1));
        mostrarMejorar(); refrescar();
        if (!p.mejorar || v > (p.umbral || 3)) avanceTimer = setTimeout(() => mostrarPaso(i + 1), 350);
      };
    });
  } else if (p.tipo === 'texto') {
    const $t = document.getElementById('txt'), $c = document.getElementById('contador');
    const actualizar = () => {
      RESP[p.key] = $t.value;
      const n = $t.value.trim().length, min = p.minimo || 1;
      $c.textContent = n < min ? 'Escribe al menos ' + min + ' caracteres (' + n + '/' + min + ')' : '¡Gracias! ✓';
      refrescar();
    };
    $t.oninput = actualizar; actualizar();
    setTimeout(() => $t.focus(), 200);
  }
  refrescar();
  if (i > 0) document.querySelector('.progreso').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function enviarEncuesta() {
  const data = Object.assign({}, RESP);
  ENC.preguntas.forEach(p => { if (p.mejorar) data[p.mejorar.key] = MEJ[p.mejorar.key] || []; });
  data.correo = IDENT.correo;
  data.firma = IDENT.firma;
  data.nombreGoogle = IDENT.nombre !== IDENT.correo ? IDENT.nombre : '';

  const btn = document.getElementById('btnSig'), $err = document.getElementById('errEnc');
  btn.disabled = true; btn.textContent = 'Enviando…'; $err.innerHTML = '';
  try {
    const res = await api({ action: 'responderEncuesta', id: ENC_ID, data: data });
    if (res.yaRespondio) return pantallaGracias(true);
    if (res.reidentificar) { borrarIdent(); return renderIdentificacion(res.error); }
    if (res.error) throw new Error(res.error);
    pantallaGracias(false);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Enviar mis respuestas';
    $err.innerHTML = '<div class="msg err">' + esc(e.message || 'No se pudo enviar. Revisa tu conexión e inténtalo de nuevo.') + '</div>';
  }
}

function pantallaGracias(yaRespondida) {
  window.scrollTo(0, 0);
  $app.innerHTML = '<div class="card centro anim"><div class="emoji">💚</div>' +
    '<h1>' + (yaRespondida ? 'Ya respondiste esta encuesta' : '¡Gracias por tu opinión!') + '</h1>' +
    '<p class="muted">Leemos cada respuesta para seguir mejorando cada módulo en CEPROCENTER.</p>' +
    (IDENT ? '<p class="muted small">Cuenta: ' + esc(IDENT.correo) + (yaRespondida ? ' · <button class="link" onclick="usarOtraCuenta()">Responder con otra cuenta</button>' : '') + '</p>' : '') +
    '</div>';
}

let CLAVE = '';
// La clave queda recordada en este navegador (no hay que escribirla cada vez). "Cerrar sesión" la borra.
try { CLAVE = localStorage.getItem('enc_clave') || sessionStorage.getItem('enc_clave') || ''; } catch (e) {}
let LISTAS = null;
let TAB = 'crear';

async function iniciarAdmin() {
  document.title = 'Encuestas y Masterclass — Ceprocenter';
  $app.classList.add('ancho');
  if (!CLAVE) return renderLogin();
  $app.innerHTML = cargando();
  const res = await api({ action: 'listasEncuesta', clave: CLAVE }).catch(() => ({ error: 'Sin conexión.' }));
  if (res.error) { CLAVE = ''; try { localStorage.removeItem('enc_clave'); sessionStorage.removeItem('enc_clave'); } catch (e) {} return renderLogin(res.error); }
  LISTAS = res;
  renderAdmin();
}

function renderLogin(error) {
  $app.innerHTML = '<div class="card" style="max-width:420px;margin:60px auto 0">' +
    '<div class="marca">Ceprocenter</div><h1>Encuestas de módulo</h1><p class="muted small">Panel interno. Ingresa la clave de administración.</p>' +

    CLAVE = document.getElementById('clave').value;

    iniciarAdmin();
  };
  document.getElementById('btnLogin').onclick = go;
  document.getElementById('clave').onkeydown = ev => { if (ev.key === 'Enter') go(); };
}

function renderAdmin() {
  $app.innerHTML =
    '<div class="marca">Ceprocenter</div><h1>Encuestas y Masterclass</h1>' +
    '<p class="muted small" style="margin:0">Crea encuestas de módulo y registros de masterclass, compártelos y revisa los resultados. · <button class="link" id="btnSalir">Cerrar sesión</button></p>' +
    '<div class="tabs"><button class="tab" data-tab="crear">➕ Crear encuesta</button><button class="tab" data-tab="lista">📊 Encuestas y resultados</button><button class="tab" data-tab="docentes">👩‍🏫 Docentes</button><button class="tab" data-tab="masterclass">🎓 Masterclass</button></div>' +

      '<datalist id="dlTutores">' + (LISTAS.tutores || []).map(t => '<option value="' + esc(t) + '">').join('') + '</datalist>' +
    '<label class="lbl">¿Dónde se dictó?</label><div class="seg" id="fModalidad">' +

    $mod.disabled = !mods.length;
    $mod.innerHTML = mods.length ? '<option value="">Selecciona el módulo…</option>' + mods.map(m => '<option>' + esc(m) + '</option>').join('') : '<option value="">Primero elige el curso</option>';

function mostrarCreada(enc) {
  const link = linkEncuesta(enc.id);
  const box = document.getElementById('resCrear');
  box.innerHTML = '<div class="card" style="border-color:#bfe6d1;background:#f6fcf9">' +

    botonesCompartir() + '</div><div class="res-envio"></div></div>';

function botonesCompartir(extra) {
  return '<div class="acciones">' +
    '<button class="btn sm sec" data-acc="copiar">📋 Copiar enlace</button>' +
    '<button class="btn sm wa" data-acc="wa">WhatsApp</button>' +
    '<button class="btn sm ghost" data-acc="correo">✉️ Enviar por correo</button>' +
    (extra || '');
}

function conectarCompartir(cont, enc) {
  const link = linkEncuesta(enc.id);
  const $res = cont.querySelector('.res-envio');
  cont.querySelector('[data-acc="copiar"]').onclick = async ev => {
    try { await navigator.clipboard.writeText(link); ev.target.textContent = '✔ Copiado'; }
    catch (e) { prompt('Copia el enlace:', link); }
  };
  cont.querySelector('[data-acc="wa"]').onclick = () => {
    const texto = '¡Hola! 👋 Terminamos ' + enc.modulo + ' del curso "' + enc.curso + '" con ' + enc.tutor +
      '. Nos ayudarías mucho respondiendo esta encuesta corta (menos de 3 minutos): ' + link + ' ¡Gracias! 💚 Equipo Ceprocenter';
    window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  };
  cont.querySelector('[data-acc="correo"]').onclick = async ev => {
    if (!confirm('¿Enviar el enlace por correo a todos los estudiantes activos de "' + enc.curso + '"?')) return;
    const btn = ev.target, original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Enviando…';
    const res = await api({ action: 'enviarEncuestaEstudiantes', clave: CLAVE, id: enc.id, link: link }).catch(() => ({ error: 'Sin conexión.' }));
    btn.disabled = false; btn.textContent = original;
    if (res.error) { $res.innerHTML = '<div class="msg err">' + esc(res.error) + '</div>'; return; }
    $res.innerHTML = '<div class="msg ok">Se enviaron ' + res.enviados + ' de ' + res.total + ' correo(s).' +
      (res.sinCorreo ? ' ' + res.sinCorreo + ' estudiante(s) sin correo registrado.' : '') +
      (res.errores && res.errores.length ? ' Errores: ' + esc(res.errores.join('; ')) : '') + '</div>';
  };
}

let LISTA_CACHE = [];
async function renderLista() {
  const panel = document.getElementById('panel');
  panel.innerHTML = cargando('Cargando encuestas…');
  const res = await api({ action: 'listarEncuestas', clave: CLAVE }).catch(() => ({ error: 'Sin conexión.' }));
  if (TAB !== 'lista') return;
  if (res.error) { panel.innerHTML = '<div class="msg err">' + esc(res.error) + '</div>'; return; }
  LISTA_CACHE = res.encuestas || [];
  panel.innerHTML = '<div class="card" style="padding:12px 14px"><input id="buscar" placeholder="Buscar por curso, módulo o docente…"></div><div id="listaEnc"></div>';
  document.getElementById('buscar').oninput = ev => pintarLista(ev.target.value);
  pintarLista('');
}

function pintarLista(filtro) {
  const f = (filtro || '').toLowerCase();
  const items = LISTA_CACHE.filter(e => !f || (e.curso + ' ' + e.modulo + ' ' + e.tutor).toLowerCase().indexOf(f) !== -1);
  const cont = document.getElementById('listaEnc');
  if (!items.length) { cont.innerHTML = '<div class="card centro muted">' + (LISTA_CACHE.length ? 'Sin resultados para la búsqueda.' : 'Todavía no hay encuestas creadas.') + '</div>'; return; }

  cont.innerHTML = items.map(e => {
    const s = e.stats, ps = s.porSeccion;
    const estado = e.abierta ? '<span class="chip ok">Abierta</span>' : '<span class="chip off">Cerrada</span>';
    const npsChip = s.recomendacion == null ? '' : '<span class="chip">Recomendación ' + fmt(s.recomendacion) + '/10</span>';
    return '<div class="card" data-id="' + esc(e.id) + '">' +
      '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2>' + esc(e.modulo) + '</h2>' +
      '<div class="muted small">' + esc(e.curso) + '</div><div class="small">Docente: <b>' + esc(e.tutor) + '</b> · ' + esc(e.modalidad) + ' · creada ' + esc(e.fechaCreacion) +
      (e.fechaCierre ? ' · cierra ' + esc(e.fechaCierre) : '') + '</div></div>' +
      '<div style="text-align:right"><div class="grande">' + s.total + (e.totalEstudiantes ? '<span class="muted" style="font-size:16px"> / ' + e.totalEstudiantes + '</span>' : '') + '</div><div class="muted small">respuestas</div></div></div>' +
      '<div class="chips">' + estado +
        '<span class="chip">Docente ' + fmt(ps.tutor) + '</span>' +
        (ps.modulo !== undefined ? '<span class="chip">Módulo ' + fmt(ps.modulo) + '</span>' : '') +
        '<span class="chip">Atención ' + fmt(ps.servicio) + '</span>' +
        (ps.instalaciones !== undefined ? '<span class="chip">Instalaciones ' + fmt(ps.instalaciones) + '</span>' : '') +
        (ps.plataforma !== undefined ? '<span class="chip">En línea ' + fmt(ps.plataforma) + '</span>' : '') +
        npsChip + (e.correosEnviados ? '<span class="chip off">✉️ ' + e.correosEnviados + ' enviados</span>' : '') +
      '</div>' +
      botonesCompartir(
        '<button class="btn sm ghost" data-acc="ver">Ver resultados</button>' +
        '<button class="btn sm ghost" data-acc="estado">' + (e.activa ? '🔒 Cerrar' : '🔓 Reabrir') + '</button>') +
      '</div><div class="res-envio"></div><div class="detalle-box"></div></div>';
  }).join('');

  cont.querySelectorAll('.card[data-id]').forEach(card => {
    const e = LISTA_CACHE.find(x => x.id === card.dataset.id);
    conectarCompartir(card, e);
    card.querySelector('[data-acc="ver"]').onclick = ev => verResultados(card, e, ev.target);
    card.querySelector('[data-acc="estado"]').onclick = async ev => {
      ev.target.disabled = true;
      const res = await api({ action: 'cambiarEstadoEncuesta', clave: CLAVE, id: e.id, activa: !e.activa }).catch(() => ({ error: 'Sin conexión.' }));
      if (res.error) { alert(res.error); ev.target.disabled = false; return; }
      renderLista();
    };
  });
}

async function verResultados(card, e, btn) {
  const box = card.querySelector('.detalle-box');
  if (box.innerHTML) { box.innerHTML = ''; btn.textContent = 'Ver resultados'; return; }
  box.innerHTML = '<div class="detalle">' + cargando('Calculando…') + '</div>';
  const r = await api({ action: 'resultadosEncuesta', clave: CLAVE, id: e.id }).catch(() => ({ error: 'Sin conexión.' }));
  if (r.error) { box.innerHTML = '<div class="msg err">' + esc(r.error) + '</div>'; return; }
  btn.textContent = 'Ocultar resultados';
  const s = r.stats;
  if (!s.total) { box.innerHTML = '<div class="detalle muted">Todavía nadie ha respondido esta encuesta.</div>'; return; }

  // Promedios por sección + NPS
  let h = '<div class="detalle"><div class="resumen">';
  r.secciones.forEach(sec => h += '<div class="card"><div class="grande">' + fmt(s.porSeccion[sec.id]) + '</div><div class="muted small">' + esc(sec.titulo) + ' (de 5)</div></div>');
  h += '<div class="card"><div class="grande">' + (s.recomendacion == null ? '—' : fmt(s.recomendacion)) + '</div><div class="muted small">Recomendación (de 10)</div></div>' +
    '<div class="card"><div class="grande">' + (s.nps == null ? '—' : s.nps) + '</div><div class="muted small">NPS (−100 a 100)</div></div></div>' +
    '<p class="muted small" style="margin:8px 0 0">NPS = % que nos recomendaría con 9 o 10, menos % que puso de 0 a 6. Más de 50 es excelente; menos de 0, alerta.</p>';

  // Promedio de cada pregunta calificable
  h += '<h2 style="margin-top:18px">Por pregunta</h2>';
  r.preguntas.filter(p => p.tipo === 'estrellas' || p.tipo === 'opciones').forEach(p => {
    const v = s.porPregunta[p.key];
    h += '<div class="pr"><div>' + esc(p.texto) + '<div class="barra"><i style="width:' + (v ? v / 5 * 100 : 0) + '%"></i></div></div><b>' + fmt(v) + '</b></div>';
  });

  // Qué marcaron para mejorar (solo quienes calificaron 3 estrellas o menos)
  const conMejoras = r.preguntas.filter(p => p.mejorar && s.mejoras[p.mejorar.key] && Object.values(s.mejoras[p.mejorar.key]).some(n => n > 0));
  if (conMejoras.length) {
    h += '<h2 style="margin-top:18px">Lo que marcaron para mejorar</h2>';
    conMejoras.forEach(p => {
      const cuenta = s.mejoras[p.mejorar.key];
      const max = Math.max.apply(null, Object.values(cuenta).concat([1]));
      h += '<p class="small" style="margin:10px 0 2px"><b>' + esc(p.mejorar.texto) + '</b></p>';
      Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a]).filter(o => cuenta[o] > 0).forEach(o => {
        h += '<div class="pr"><div>' + esc(o) + '<div class="barra"><i style="width:' + (cuenta[o] / max * 100) + '%;background:#d9534f"></i></div></div><b>' + cuenta[o] + '</b></div>';
      });
    });
  }

  // Temáticas que piden para próximas capacitaciones
  const tematicas = r.respondieron.filter(x => String(x.tematica || '').trim());
  if (tematicas.length) {
    h += '<h2 style="margin-top:18px">Temáticas que les gustaría (' + tematicas.length + ')</h2><div class="chips">' +
      tematicas.map(x => '<span class="chip" title="' + esc(x.nombre) + '">' + esc(x.tematica) + '</span>').join('') + '</div>';
  }

  // Comentarios (todos, son obligatorios)

      (etiquetas(x) ? '<div class="chips" style="margin-top:4px">' + etiquetas(x) + '</div>' : '') + '</div>';
  });

  h += '<h2 style="margin-top:18px">Quién respondió (' + r.respondieron.length + ')</h2>' +

/* ---------- Pestaña "Docentes": resumen de cada docente en todos sus cursos ---------- */

let DOC_CACHE = [];

// Estrellas visuales para un promedio (ej. 4.3 → ★★★★☆ con la quinta parcialmente llena).
function estrellasHTML(prom, tam) {
  const pct = prom == null ? 0 : Math.max(0, Math.min(100, prom / 5 * 100));
  return '<span class="stars" style="font-size:' + (tam || 18) + 'px" aria-label="' + (prom == null ? 'Sin calificación' : fmt(prom) + ' de 5') + '">' +
    '<span class="stars-bg">★★★★★</span><span class="stars-fg" style="width:' + pct + '%">★★★★★</span></span>';
}

// "Módulo 3: Lenguaje y …" → "M3"
function moduloCorto(m) {
  const x = String(m || '').match(/m[oó]dulo\s*(\d+)/i);
  return x ? 'M' + x[1] : String(m || '').slice(0, 6);
}

let DOC_SEL = -1;

async function renderDocentes() {
  const panel = document.getElementById('panel');
  panel.innerHTML = cargando('Calculando el resumen de docentes…');
  const res = await api({ action: 'resumenDocentes', clave: CLAVE }).catch(() => ({ error: 'Sin conexión.' }));

  if (res.error) { panel.innerHTML = '<div class="msg err">' + esc(res.error) + '</div>'; return; }
  DOC_CACHE = (res.docentes || []).slice().sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));
  if (!DOC_CACHE.length) { panel.innerHTML = '<div class="card centro muted">Todavía no hay encuestas creadas.</div>'; return; }

  panel.innerHTML = '<div class="card"><h2>Elige un docente</h2>' +

      '<span>' + (d.promedio == null ? 'Sin respuestas' : '★ ' + fmt(d.promedio) + ' · ' + d.respuestas + ' resp.') + '</span></button>').join('') +
    '</div></div><div id="docDetalle"></div>';

  const elegir = i => {

    document.getElementById('docDetalle').innerHTML = '<div class="card anim">' +
      '<div class="doc-fila"><div><h2 style="margin:0">' + esc(d.nombre) + '</h2>' +
      '<div class="small muted">' + d.respuestas + ' respuesta(s) · ' + d.totalEncuestas + ' módulo(s) evaluado(s)</div>' +

      detalleDocenteHTML(d) + '</div>';
  };

function detalleDocenteHTML(d) {
  if (!d.respuestas) return '<div class="detalle muted">Este docente todavía no tiene respuestas.</div>';
  let h = '<div class="detalle">';

  // Tarjetas resumen
  h += '<div class="resumen">' +
    '<div class="card"><div class="grande">' + fmt(d.promedio) + '</div>' + estrellasHTML(d.promedio, 16) + '<div class="muted small">Calificación (de 5)</div></div>' +
    '<div class="card"><div class="grande">' + fmt(d.promedioModulo) + '</div><div class="muted small">Utilidad profesional (de 5)</div></div>' +
    '<div class="card"><div class="grande">' + (d.volverPct == null ? '—' : d.volverPct + '%') + '</div><div class="muted small">Volverían a tener clases con él/ella</div></div>' +
    '<div class="card"><div class="grande">' + d.respuestas + '</div><div class="muted small">Respuestas</div></div></div>';

  // Distribución de estrellas
  const maxE = Math.max.apply(null, d.estrellas.concat([1]));
  h += '<h2 style="margin-top:18px">Cómo lo califican</h2>';
  for (let v = 5; v >= 1; v--) {
    const n = d.estrellas[v - 1];
    h += '<div class="dist"><span class="dist-et">' + v + ' ★</span><div class="barra"><i style="width:' + (n / maxE * 100) + '%"></i></div><b>' + n + '</b></div>';
  }

  // Evolución por módulo (cronológico)
  const conDatos = d.encuestas.filter(e => e.docente != null);
  if (conDatos.length) {
    h += '<h2 style="margin-top:18px">Calificación por módulo</h2><p class="muted small" style="margin:0 0 6px">De más antiguo a más reciente. Pasa el dedo o el mouse sobre una barra para ver el detalle.</p>' +
      '<div class="grafico" role="img" aria-label="Calificación del docente en cada módulo, de 0 a 5">' +
      '<div class="ejes"><span>5</span><span>2.5</span><span>0</span></div><div class="barras">' +
      conDatos.map(e => {
        const info = e.modulo + ' — ' + e.curso + ' · ' + e.fecha + ' · ' + e.respuestas + ' respuesta(s) · ' + fmt(e.docente) + ' de 5';
        return '<div class="col" tabindex="0" title="' + esc(info) + '"><div class="val">' + fmt(e.docente) + '</div>' +
          '<div class="pista"><i style="height:' + (e.docente / 5 * 100) + '%"></i></div><div class="et">' + esc(moduloCorto(e.modulo)) + '</div>' +
          '<div class="tip">' + esc(info) + '</div></div>';
      }).join('') + '</div></div>';
  }

  // Lo que más marcan para mejorar
  const claves = Object.keys(d.mejoras).sort((a, b) => d.mejoras[b] - d.mejoras[a]);
  h += '<h2 style="margin-top:18px">Lo que más marcan para mejorar</h2>';
  if (!claves.length) h += '<p class="muted small">Nadie ha marcado aspectos a mejorar. 🎉</p>';
  else {
    const maxM = d.mejoras[claves[0]];
    claves.forEach(o => {
      h += '<div class="pr"><div>' + esc(o) + '<div class="barra"><i style="width:' + (d.mejoras[o] / maxM * 100) + '%;background:#d9534f"></i></div></div><b>' + d.mejoras[o] + '</b></div>';
    });
  }

  // Tabla de módulos
  h += '<h2 style="margin-top:18px">Módulos evaluados</h2><div style="overflow-x:auto"><table class="tabla"><thead><tr>' +
    '<th>Fecha</th><th>Curso</th><th>Módulo</th><th>Modalidad</th><th>Resp.</th><th>Docente</th><th>Utilidad</th><th>Volverían</th></tr></thead><tbody>' +
    d.encuestas.slice().reverse().map(e => '<tr><td>' + esc(e.fecha) + '</td><td>' + esc(e.curso) + '</td><td>' + esc(e.modulo) + '</td><td>' + esc(e.modalidad) +
      '</td><td>' + e.respuestas + '</td><td><b>' + fmt(e.docente) + '</b></td><td>' + fmt(e.moduloProm) + '</td><td>' +
      (e.volverPct == null ? '—' : e.volverPct + '%') + '</td></tr>').join('') +
    '</tbody></table></div>';

  // Comentarios recientes
  h += '<h2 style="margin-top:18px">Lo que dicen de ' + esc(d.nombre) + ' (' + d.comentarios.length + ')</h2>';
  d.comentarios.forEach(c => {
    h += '<div class="coment"><div class="small">' + (c.estrellas ? estrellasHTML(c.estrellas, 13) + ' ' : '') + '<b>' + esc(c.nombre) + '</b> ' +
      '<span class="muted">· ' + esc(moduloCorto(c.modulo)) + ' · ' + esc(c.curso) + ' · ' + esc(c.fecha) + '</span></div><p>' + esc(c.texto) + '</p></div>';
  });

  return h + '</div>';
}

function mcFecha(f) {
  const m = String(f || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return String(f || '');
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return parseInt(m[3], 10) + ' de ' + meses[parseInt(m[2], 10) - 1] + ' de ' + m[1];
}

function mcArchivoBase64(file) {
  return new Promise((ok, mal) => {
    if (file.size > 8 * 1024 * 1024) return mal(new Error('El archivo "' + file.name + '" pesa demasiado. Usa una foto o captura más liviana (máximo 8MB).'));
    const r = new FileReader();
    r.onload = () => ok(r.result.split(',')[1]);
    r.onerror = () => mal(new Error('No se pudo leer el archivo "' + file.name + '".'));
    r.readAsDataURL(file);
  });
}

async function enviarMasterclass(cert, pago) {
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const data = { nombre: v('mNombre'), correo: v('mCorreo'), pais: v('mPais'), telefono: v('mTel'), ciudad: v('mCiudad'), profesion: v('mProf'),
    nombreCertificado: cert ? v('mCert') : '', metodoPago: '', cuentaDestino: '', referenciaPago: '', autorizoDatos: true, archivos: {} };
  if (!data.nombre || !data.correo || !data.pais || !data.telefono || !data.ciudad || !data.profesion || (cert && !data.nombreCertificado))
    return mcToast('Por favor completa todos los campos marcados con *.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.correo)) return mcToast('Revisa tu correo: parece que no está bien escrito.');
  let comp = null;
  if (pago) {
    data.metodoPago = v('mMetodo');
    data.cuentaDestino = document.getElementById('mCuentaWrap').style.display !== 'none' ? v('mCuenta') : '';
    data.referenciaPago = v('mRef');
    comp = document.getElementById('mComp').files[0];
    if (!data.metodoPago) return mcToast('Selecciona tu método de pago.');
    if (/Transferencia|Depósito/.test(data.metodoPago) && !data.cuentaDestino) return mcToast('Selecciona a cuál cuenta transferiste o depositaste.');
    if (!comp) return mcToast('El comprobante de pago es obligatorio.');
  }
  if (!document.getElementById('mAutorizo').checked) return mcToast('Debes autorizar el uso de tus datos personales para continuar.');

  const btn = document.getElementById('mEnviar');
  btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    if (comp) data.archivos.comprobante = { data: await mcArchivoBase64(comp), name: comp.name, mimeType: comp.type || 'application/octet-stream' };
    // Si mucha gente se registra al mismo tiempo, el servidor puede estar ocupado un momento:
    // se reintenta solo (hasta 4 veces). Es seguro porque el mismo correo nunca se duplica.
    let res = null, ultimoError = '';
    for (let intento = 0; intento < 5; intento++) {
      if (intento > 0) {
        btn.textContent = 'Muchas personas registrándose, reintentando… (' + intento + '/4)';
        await new Promise(r => setTimeout(r, 2000 * intento + Math.random() * 1500));
      }
      try { res = await api({ action: 'registrarMasterclass', id: MC_ID, data: data }); }
      catch (e) { res = null; ultimoError = 'Sin conexión o servidor ocupado.'; continue; }
      if (res && res.error && (res.ocupado || /too many|demasiad|simult|lock|timeout|tiempo/i.test(res.error))) { ultimoError = res.error; res = null; continue; }
      break;
    }
    if (!res) throw new Error(ultimoError + ' Espera un minuto y vuelve a tocar "Registrarme"; tus datos siguen escritos.');
    if (res.error) throw new Error(res.error);
    document.getElementById('mcForm').outerHTML = '<div class="card centro anim"><div class="emoji">' + (cert ? '🎓' : '✅') + '</div><h2>¡Registro completado!</h2><p class="muted">' +
      (res.duplicado ? 'Ya estabas registrado; actualizamos tus datos. ' : 'Ya tenemos tus datos. ') +
      '¡Nos vemos en la masterclass!</p>' +
      mcBotonGrupo(MC.grupoWhatsapp) + '</div>';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (e) {
    mcToast('Hubo un problema al enviar: ' + (e.message || 'error inesperado.'));
    btn.disabled = false; btn.textContent = 'Registrarme';
  }
}

  panel.innerHTML =
    '<div class="acciones" style="margin-top:16px">' +
      '<button class="btn sm ' + (MC_VISTA === 'lista' ? '' : 'ghost') + '" data-v="lista">📋 Mis masterclass</button>' +
      '<button class="btn sm ' + (MC_VISTA === 'crear' ? '' : 'ghost') + '" data-v="crear">➕ Crear masterclass</button></div>' +
    '<div id="mcPanel"></div>';
  panel.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { MC_VISTA = b.dataset.v; renderMasterclass(); });
  if (MC_VISTA === 'crear') mcRenderCrear(); else mcRenderLista();
}

function mcRenderCrear() {
  const box = document.getElementById('mcPanel');
  box.innerHTML = '<div class="card">' +
    '<label class="lbl" for="cNombre" style="margin-top:0">Nombre de la masterclass</label><input id="cNombre" placeholder="Así lo verán los asistentes en el formulario">' +
    '<label class="lbl" for="cFecha">Fecha <span class="muted small">(opcional)</span></label><input id="cFecha" type="date">' +
    '<label class="lbl" for="cGrupo">Link del grupo de WhatsApp <span class="muted small">(opcional)</span></label><input id="cGrupo" type="url" placeholder="https://chat.whatsapp.com/...">' +
    '<p class="muted small" style="margin:4px 0 0">Al terminar el registro, la persona verá un botón para unirse a este grupo.</p>' +
    '<label class="mc-check" style="margin-top:16px"><input type="checkbox" id="cCert"><span><b>Entrega certificado</b><br><span class="muted small">El formulario pedirá cómo quieren su nombre en el certificado.</span></span></label>' +
    '<label class="mc-check" id="cPagoWrap" style="display:none;margin-left:30px"><input type="checkbox" id="cPago"><span><b>El certificado tiene costo</b><br><span class="muted small">El formulario pedirá método de pago y comprobante.</span></span></label>' +
    '<div style="margin-top:16px"><button class="btn full" id="cCrear">Crear y obtener enlace</button></div>' +
    '<div id="cRes"></div></div>';
  const $cert = document.getElementById('cCert');
  $cert.onchange = () => { document.getElementById('cPagoWrap').style.display = $cert.checked ? 'flex' : 'none'; if (!$cert.checked) document.getElementById('cPago').checked = false; };
  document.getElementById('cCrear').onclick = async () => {
    const nombre = document.getElementById('cNombre').value.trim();
    const $res = document.getElementById('cRes');
    if (!nombre) { $res.innerHTML = '<div class="msg err">Escribe el nombre de la masterclass.</div>'; return; }
    const grupo = document.getElementById('cGrupo').value.trim();
    if (grupo && !mcLinkSeguro(grupo)) { $res.innerHTML = '<div class="msg err">El link del grupo debe empezar con https:// (cópialo desde WhatsApp → Invitar al grupo mediante enlace).</div>'; return; }
    const btn = document.getElementById('cCrear');
    btn.disabled = true; btn.textContent = 'Creando…'; $res.innerHTML = '';
    const data = { nombre: nombre, fecha: document.getElementById('cFecha').value, grupoWhatsapp: grupo, conCertificado: $cert.checked, conPago: $cert.checked && document.getElementById('cPago').checked };
    const res = await api({ action: 'crearMasterclass', clave: CLAVE, data: data }).catch(() => ({ error: 'Sin conexión.' }));
    btn.disabled = false; btn.textContent = 'Crear y obtener enlace';
    if (res.error) { $res.innerHTML = '<div class="msg err">' + esc(res.error) + '</div>'; return; }
    MC_LISTA.unshift(res.masterclass);
    $res.innerHTML = '<div class="msg ok">✔ Masterclass creada. Este es el enlace para compartir:<br><b style="word-break:break-all">' + esc(linkMasterclass(res.masterclass.id)) + '</b></div>' + mcBotones();
    mcConectar($res, res.masterclass);
    document.getElementById('cNombre').value = ''; document.getElementById('cFecha').value = ''; document.getElementById('cGrupo').value = '';
    $cert.checked = false; $cert.onchange();
  };
}

function mcBotones(extra) {
  return '<div class="acciones">' +
    '<button class="btn sm sec" data-mc="copiar">📋 Copiar enlace</button>' +
    '<button class="btn sm wa" data-mc="wa">WhatsApp</button>' +
    '<button class="btn sm ghost" data-mc="abrir">Ver formulario</button>' + (extra || '') + '</div>';
}

function mcConectar(cont, ev) {
  const link = linkMasterclass(ev.id);
  cont.querySelector('[data-mc="copiar"]').onclick = async e => {
    try { await navigator.clipboard.writeText(link); e.target.textContent = '✔ Copiado'; } catch (_) { prompt('Copia el enlace:', link); }
  };
  cont.querySelector('[data-mc="wa"]').onclick = () => {
    const texto = '¡Hola! 👋 Regístrate en la masterclass "' + ev.nombre + '"' + (ev.conCertificado ? ' para recibir tu certificado' : '') + ': ' + link + ' 💚 Equipo Ceprocenter';
    window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  };
  cont.querySelector('[data-mc="abrir"]').onclick = () => window.open(link, '_blank');
}

function mcRenderLista() {
  const box = document.getElementById('mcPanel');
  if (!MC_LISTA.length) {
    box.innerHTML = '<div class="card centro"><div class="emoji">🎓</div><h2>Aún no has creado ninguna masterclass</h2><p class="muted">Usa “➕ Crear masterclass” para empezar.</p></div>';
    return;
  }
  box.innerHTML = MC_LISTA.map((ev, i) =>
    '<div class="card" data-i="' + i + '"' + (ev.activa ? '' : ' style="opacity:.7"') + '>' +
      '<div class="doc-fila"><div><h2>' + esc(ev.nombre) + '</h2><div class="muted small">' + (ev.fecha ? esc(mcFecha(ev.fecha)) : 'Sin fecha') + '</div>' +
        '<div class="chips">' + (ev.activa ? '<span class="chip ok">Registro abierto</span>' : '<span class="chip off">Registro cerrado</span>') +
          (ev.conCertificado ? '<span class="chip">🎓 Con certificado</span>' : '<span class="chip off">Sin certificado</span>') +
          (ev.conPago ? '<span class="chip warn">💳 Certificado con costo</span>' : '') +
          (mcLinkSeguro(ev.grupoWhatsapp) ? '<span class="chip ok">📲 Grupo de WhatsApp</span>' : '<span class="chip off">Sin grupo de WhatsApp</span>') + '</div></div>' +
        '<div class="doc-nota"><div class="grande">' + (ev.inscritos || 0) + '</div><div class="muted small">registrados</div></div></div>' +
      mcBotones('<button class="btn sm sec" data-mc="ver">👥 Ver registrados</button><button class="btn sm ghost" data-mc="grupo">📲 ' + (mcLinkSeguro(ev.grupoWhatsapp) ? 'Cambiar grupo' : 'Agregar grupo') + '</button><button class="btn sm ghost" data-mc="estado">' + (ev.activa ? 'Cerrar registro' : 'Reabrir registro') + '</button>') +
      '<div class="mc-inscritos"></div></div>').join('');

  box.querySelectorAll('[data-i]').forEach(card => {
    const ev = MC_LISTA[+card.dataset.i];
    mcConectar(card, ev);
    card.querySelector('[data-mc="estado"]').onclick = async e => {
      if (!confirm('¿Seguro que quieres ' + (ev.activa ? 'cerrar' : 'reabrir') + ' el registro de "' + ev.nombre + '"?')) return;
      e.target.disabled = true;
      const res = await api({ action: 'cambiarEstadoMasterclass', clave: CLAVE, id: ev.id, activa: !ev.activa }).catch(() => ({ error: 'Sin conexión.' }));
      if (res.error) { alert(res.error); e.target.disabled = false; return; }
      ev.activa = !ev.activa; mcRenderLista();
    };
    card.querySelector('[data-mc="ver"]').onclick = () => mcVerInscritos(card, ev);
    card.querySelector('[data-mc="grupo"]').onclick = async e => {
      const nuevo = prompt('Pega el link del grupo de WhatsApp de "' + ev.nombre + '".\n(Déjalo vacío para quitarlo.)', ev.grupoWhatsapp || '');
      if (nuevo === null) return;
      const link = nuevo.trim();
      if (link && !mcLinkSeguro(link)) { alert('El link debe empezar con https:// (cópialo desde WhatsApp → Invitar al grupo mediante enlace).'); return; }
      e.target.disabled = true;
      const res = await api({ action: 'grupoMasterclass', clave: CLAVE, id: ev.id, grupoWhatsapp: link }).catch(() => ({ error: 'Sin conexión.' }));
      if (res.error) { alert(res.error); e.target.disabled = false; return; }
      ev.grupoWhatsapp = res.grupoWhatsapp || ''; mcRenderLista();
    };
  });
}

async function mcVerInscritos(card, ev) {
  const box = card.querySelector('.mc-inscritos');
  if (box.innerHTML) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="detalle centro" style="padding:20px"><div class="spinner"></div></div>';
  const res = await api({ action: 'inscritosMasterclass', clave: CLAVE, id: ev.id }).catch(() => ({ error: 'Sin conexión.' }));
  if (res.error) { box.innerHTML = '<div class="msg err">' + esc(res.error) + '</div>'; return; }
  const filas = res.inscritos || [];
  if (!filas.length) { box.innerHTML = '<div class="msg info">Todavía no hay registrados.</div>'; return; }
  const cols = [['nombre','Nombre'],['correo','Correo'],['telefono','Teléfono'],['pais','País'],['ciudad','Ciudad'],['profesion','Profesión']];
  if (ev.conCertificado) cols.push(['nombreCertificado','Nombre en certificado']);
  if (ev.conPago) cols.push(['metodoPago','Pago'],['referenciaPago','Referencia'],['comprobanteUrl','Comprobante']);
  const celda = (f, k) => k === 'comprobanteUrl' ? (f[k] ? '<a href="' + esc(f[k]) + '" target="_blank">Ver</a>' : '') : esc(String(f[k] == null ? '' : f[k]).replace(/^'/, ''));
  box.innerHTML = '<div class="detalle"><div style="overflow-x:auto"><table class="tabla"><thead><tr><th>#</th>' + cols.map(c => '<th>' + c[1] + '</th>').join('') + '</tr></thead><tbody>' +
    filas.map((f, i) => '<tr><td>' + (i + 1) + '</td>' + cols.map(([k]) => '<td>' + celda(f, k) + '</td>').join('') + '</tr>').join('') +
    '</tbody></table></div><div class="acciones"><button class="btn sm sec" data-mc="csv">⬇️ Descargar lista (Excel)</button></div></div>';
  box.querySelector('[data-mc="csv"]').onclick = () => {
    const q = s => '"' + String(s == null ? '' : s).replace(/^'/, '').replace(/"/g, '""') + '"';
    const csv = '﻿' + [cols.map(c => q(c[1])).join(';')].concat(filas.map(f => cols.map(([k]) => q(f[k])).join(';'))).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'Registrados - ' + ev.nombre.replace(/[\\/:*?"<>|]/g, '') + '.csv';
    a.click();
  };
}

/* ========================================================================= */
if (SCRIPT_URL.indexOf('PEGA_AQUI') === 0) {
  $app.innerHTML = '<div class="card msg err">Falta configurar SCRIPT_URL al inicio del archivo encuestas.html.</div>';
} else if (MC_ID) {
  iniciarFormMasterclass();
} else if (ENC_ID) {
  iniciarEncuesta();
} else {
  iniciarAdmin();
}
</script>
