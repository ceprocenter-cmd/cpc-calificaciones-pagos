<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ceprocenter · Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF0F5; --panel: #FFFFFF; --panel-2: #F5F6FA; --line: #DEE2EA;
    --accent: #7A9A1E; --accent-soft: rgba(122,154,30,0.14); --accent-dark: #62801A;
    --text: #24273A; --text-dim: #767C93;
    --danger: #D9614F; --radius: 12px; --wa: #25A35A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Quicksand',sans-serif;letter-spacing:0.01em;}
  .wrap{max-width:600px;margin:0 auto;padding:32px 20px 60px;}
  .wrap.ancho{max-width:860px;}
  .top{text-align:center;margin-bottom:26px;}
  .top h1{font-size:24px;font-weight:700;margin:0;color:var(--text);}
  .top .sub{color:var(--text-dim);font-size:14px;margin-top:8px;line-height:1.5;}
  .accent{color:var(--accent-dark);}
  .mc-card{background:var(--accent-soft);border:1px solid rgba(122,154,30,0.35);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;text-align:center;}
  .mc-card .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;color:var(--accent-dark);}
  .mc-card .nombre{font-family:'Quicksand',sans-serif;font-size:19px;font-weight:700;margin-top:4px;}
  .mc-card .fecha{font-size:13px;color:var(--text-dim);margin-top:4px;}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 1px 2px rgba(36,39,58,0.04);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin-bottom:6px;}
  .field .req{color:var(--danger);}
  .field input, .field select{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;}
  .field input:focus, .field select:focus{outline:none;border-color:var(--accent-dark);}
  .field .hint{font-size:12px;color:var(--text-dim);margin-top:5px;line-height:1.45;}
  .section-label{font-family:'Quicksand',sans-serif;font-weight:700;font-size:15px;color:var(--accent-dark);margin:28px 0 14px;padding-top:18px;border-top:1px solid var(--line);}
  .section-label.first{border-top:none;padding-top:0;margin-top:6px;}
  .check{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;cursor:pointer;}
  .check input{width:20px;height:20px;margin-top:1px;flex-shrink:0;accent-color:var(--accent);}
  .check span{font-size:14.5px;line-height:1.45;}
  .check small{display:block;color:var(--text-dim);font-size:12.5px;}
  .preview-cert{margin-top:10px;background:var(--panel-2);border:1px dashed var(--line);border-radius:9px;padding:14px;text-align:center;}
  .preview-cert .lbl{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;}
  .preview-cert .nom{font-family:'Quicksand',sans-serif;font-size:19px;font-weight:700;margin-top:6px;min-height:24px;}
  .btn{width:100%;font-family:'Quicksand',sans-serif;font-size:16px;font-weight:700;border-radius:10px;padding:14px;border:none;cursor:pointer;background:var(--accent);color:#fff;margin-top:8px;}
  .btn:hover{background:var(--accent-dark);}
  .btn:disabled{opacity:0.6;cursor:default;}
  .btn.sm{width:auto;font-size:13.5px;padding:9px 13px;margin-top:0;}
  .btn.sec{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
  .btn.sec:hover{background:var(--line);}
  .btn.wa{background:var(--wa);}
  .btn.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--line);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:12px 20px;border-radius:9px;font-size:13.5px;opacity:0;transition:all 0.25s ease;pointer-events:none;z-index:100;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .success-box{text-align:center;padding:50px 20px;}
  .success-box .icono{font-size:44px;margin-bottom:16px;}
  .success-box h2{font-size:20px;margin:0 0 10px;}
  .success-box p{color:var(--text-dim);font-size:14px;line-height:1.6;}
  .centro{text-align:center;color:var(--text-dim);padding:40px 20px;}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:gira 0.8s linear infinite;}
  @keyframes gira{to{transform:rotate(360deg);}}
  .msg{margin-top:12px;padding:10px 12px;border-radius:9px;font-size:13.5px;}
  .msg.err{background:rgba(217,97,79,0.1);color:#B04634;}
  .msg.ok{background:var(--accent-soft);color:var(--accent-dark);}
  /* Admin */
  .tabs{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap;}
  .tab{font-family:'Quicksand',sans-serif;font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);cursor:pointer;}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .ev{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px;}
  .ev.cerrada{opacity:0.65;}
  .ev-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;}
  .ev-nombre{font-family:'Quicksand',sans-serif;font-weight:700;font-size:17px;}
  .ev-meta{font-size:13px;color:var(--text-dim);margin-top:3px;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--panel-2);color:var(--text-dim);border:1px solid var(--line);}
  .badge.verde{background:var(--accent-soft);color:var(--accent-dark);border-color:transparent;}
  .badge.rojo{background:rgba(217,97,79,0.1);color:#B04634;border-color:transparent;}
  .conteo{text-align:right;}
  .conteo b{font-family:'Quicksand',sans-serif;font-size:24px;display:block;line-height:1;}
  .conteo span{font-size:12px;color:var(--text-dim);}
  .acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .tabla-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:9px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{background:var(--panel-2);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);}
  tr:last-child td{border-bottom:none;}
  td a{color:var(--accent-dark);}
  .link-box{margin-top:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px;font-size:13px;word-break:break-all;}
  .sub-opcion{margin-left:30px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
// Misma URL del Apps Script que usan Pre-Registro, Encuestas y las demás herramientas.
const API_URL = 'https://script.google.com/macros/s/AKfycbzSocYjhrj1F0wvNecAnGeepxsP_jie58658PL-jnQXtiVqqAT7283HpXWRs7HOWkNJ/exec';

const params = new URLSearchParams(location.search);
const MC_ID = params.get('id');
const $app = document.getElementById('app');

async function api(payload){
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error(`El servidor respondió con un error (código ${res.status}).`);
  try{ return await res.json(); }catch(_){ throw new Error('El servidor devolvió una respuesta inesperada.'); }
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3600); }
function cargando(texto){ return `<div class="panel centro"><div class="spinner"></div>${esc(texto||'Cargando…')}</div>`; }
function logo(){ return `<img src="logo.png" alt="Ceprocenter" style="max-width:180px;margin:0 auto 16px;display:block;" onerror="this.style.display='none';">`; }
function linkMasterclass(id){ return location.origin + location.pathname + '?id=' + encodeURIComponent(id); }
function fechaBonita(f){
  if(!f) return '';
  const m = String(f).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return String(f);
  const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  return `${parseInt(m[3],10)} de ${meses[parseInt(m[2],10)-1]} de ${m[1]}`;
}

/* =========================================================================
   FORMULARIO PÚBLICO  (masterclass.html?id=MC-XXXX)
   ========================================================================= */
let MC = null;

async function iniciarFormulario(){
  $app.innerHTML = cargando('Cargando formulario…');
  let res;
  try{ res = await api({ action:'obtenerMasterclass', id: MC_ID }); }
  catch(e){ res = { error: 'Sin conexión. Revisa tu internet y recarga la página.' }; }
  if(!res || res.error || !res.masterclass){
    $app.innerHTML = `<div class="top">${logo()}</div><div class="panel centro">${esc((res&&res.error)||'No encontramos esta masterclass. Verifica el enlace que te enviaron.')}</div>`;
    return;
  }
  MC = res.masterclass;
  document.title = 'Ceprocenter · ' + MC.nombre;
  if(!MC.activa){
    $app.innerHTML = `<div class="top">${logo()}</div>${tarjetaMC()}<div class="panel centro">El registro para esta masterclass ya está cerrado.</div>`;
    return;
  }
  pintarFormulario();
}

function tarjetaMC(){
  return `<div class="mc-card"><div class="tag">Masterclass</div><div class="nombre">${esc(MC.nombre)}</div>${MC.fecha?`<div class="fecha">${esc(fechaBonita(MC.fecha))}</div>`:''}</div>`;
}

function pintarFormulario(){
  const conCert = !!MC.conCertificado, conPago = !!(MC.conCertificado && MC.conPago);
  $app.innerHTML = `
  <div class="top">${logo()}
    <h1>Registro <span class="accent">Masterclass</span></h1>
    <div class="sub">${conCert ? 'Completa tus datos para registrarte y recibir tu certificado.' : 'Completa tus datos para registrarte.'}</div>
  </div>
  ${tarjetaMC()}
  <div class="panel" id="form_box">
    <div class="section-label first">Tus datos</div>
    <div class="field"><label>Nombres y apellidos completos <span class="req">*</span></label><input id="f_nombre" autocomplete="name" placeholder="Tu nombre completo"></div>
    <div class="field"><label>Correo electrónico <span class="req">*</span></label><input id="f_correo" type="email" autocomplete="email" placeholder="correo@ejemplo.com">${conCert?'<div class="hint">A este correo te enviaremos tu certificado. Revísalo bien.</div>':''}</div>
    <div class="field"><label>País <span class="req">*</span></label><input id="f_pais" list="lista_paises" placeholder="País"><datalist id="lista_paises"></datalist></div>
    <div class="field"><label>Teléfono (WhatsApp) <span class="req">*</span></label><input id="f_telefono" type="tel" placeholder="+593 ..."></div>
    <div class="field"><label>Ciudad <span class="req">*</span></label><input id="f_ciudad" placeholder="Ciudad"></div>
    <div class="field"><label>Profesión <span class="req">*</span></label><input id="f_profesion" placeholder="Profesión"></div>

    ${conCert ? `
    <div class="section-label">Tu certificado</div>
    <div class="field">
      <label>¿Cómo quieres que aparezca tu nombre en el certificado? <span class="req">*</span></label>
      <input id="f_certificado" placeholder='Ej. "Lic. María Pérez"'>
      <div class="hint">Escríbelo exactamente como lo quieres, con tildes y mayúsculas. Si no usas título, deja solo tu nombre.</div>
      <div class="preview-cert"><div class="lbl">Así se verá en tu certificado</div><div class="nom" id="preview_nombre">—</div></div>
    </div>` : ''}

    ${conPago ? `
    <div class="section-label">Pago del certificado</div>
    <div class="field"><label>Método de Pago <span class="req">*</span></label>
      <select id="f_metodo_pago">
        <option value="">Selecciona una opción</option>
        <option>Transferencia Bancaria</option><option>Depósito</option><option>Efectivo</option>
        <option>PayPal</option><option>Zelle</option><option>Binance</option><option>Pago Móvil</option>
        <option>Western Union/Zoom</option><option>Tarjeta de Crédito</option><option>Otro</option>
      </select>
    </div>
    <div class="field" id="f_cuenta_destino_wrap" style="display:none;"><label>¿A cuál cuenta transferiste/depositaste? <span class="req">*</span></label>
      <select id="f_cuenta_destino">
        <option value="">Selecciona una opción</option>
        <option>Banco Pacífico</option><option>Banco Pichincha</option><option>Banco Guayaquil</option><option>Otra</option>
      </select>
    </div>
    <div class="field"><label>N° de Referencia del Pago</label><input id="f_referencia_pago" placeholder="Número de comprobante o transacción"></div>
    <div class="field"><label>Comprobante de pago <span class="req">*</span></label><input id="f_file_comprobante" type="file" accept="image/*,.pdf"></div>` : ''}

    <label class="check" style="margin-top:24px;">
      <input type="checkbox" id="f_autorizo">
      <span>Autorizo el uso de mis datos personales para fines administrativos y de comunicación de Ceprocenter. <a href="privacidad.html" target="_blank" style="color:var(--accent-dark);">Política de privacidad</a>. <span style="color:var(--danger)">*</span></span>
    </label>

    <button class="btn" id="btn_enviar">Registrarme</button>
  </div>
  <div class="panel success-box" id="success_box" style="display:none;">
    <div class="icono">${conCert?'🎓':'✅'}</div>
    <h2>¡Registro completado!</h2>
    <p id="success_msg">${conCert ? 'Ya tenemos tus datos. Te enviaremos tu certificado al correo que registraste.' : 'Ya tenemos tus datos. ¡Nos vemos en la masterclass!'}</p>
  </div>`;

  conectarPaisTelefono();
  if(conCert) conectarPreviewCertificado();
  if(conPago){
    document.getElementById('f_metodo_pago').addEventListener('change', ()=>{
      const m = document.getElementById('f_metodo_pago').value;
      document.getElementById('f_cuenta_destino_wrap').style.display = (m==='Transferencia Bancaria'||m==='Depósito') ? 'block' : 'none';
    });
  }
  document.getElementById('btn_enviar').addEventListener('click', ()=>enviarRegistro(conCert, conPago));
}

const CODIGOS_PAIS = {
  'ecuador':'+593','colombia':'+57','venezuela':'+58','peru':'+51','mexico':'+52',
  'argentina':'+54','chile':'+56','bolivia':'+591','paraguay':'+595','uruguay':'+598',
  'brasil':'+55','panama':'+507','costa rica':'+506','guatemala':'+502','honduras':'+504',
  'el salvador':'+503','nicaragua':'+505','republica dominicana':'+1','cuba':'+53',
  'espana':'+34','estados unidos':'+1','canada':'+1','puerto rico':'+1'
};
function normalizarPais(t){ return (t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); }

function conectarPaisTelefono(){
  document.getElementById('lista_paises').innerHTML = ['Ecuador','Colombia','Venezuela','Perú','México','Argentina','Chile','Bolivia','Paraguay','Uruguay','Brasil','Panamá','Costa Rica','Guatemala','Honduras','El Salvador','Nicaragua','República Dominicana','Cuba','España','Estados Unidos','Canadá','Puerto Rico'].map(p=>`<option value="${p}">`).join('');
  const pais = document.getElementById('f_pais'), tel = document.getElementById('f_telefono');
  const actualizar = ()=>{
    const codigo = CODIGOS_PAIS[normalizarPais(pais.value)];
    if(!codigo) return;
    const actual = tel.value.trim();
    if(!actual) tel.value = codigo + ' ';
    else if(/^\+\d+/.test(actual)) tel.value = actual.replace(/^\+\d+\s*/, codigo + ' ');
    else tel.value = codigo + ' ' + actual;
  };
  pais.addEventListener('change', actualizar);
  pais.addEventListener('blur', actualizar);
  tel.addEventListener('focus', ()=>{ if(!tel.value.trim()) actualizar(); });
}

function conectarPreviewCertificado(){
  const cert = document.getElementById('f_certificado'), nombre = document.getElementById('f_nombre');
  let editadoAMano = false;
  const pintar = ()=>{ document.getElementById('preview_nombre').textContent = cert.value.trim() || '—'; };
  cert.addEventListener('input', ()=>{ editadoAMano = true; pintar(); });
  // Mientras no toquen el campo del certificado, se rellena con su nombre; solo agregan el título si quieren.
  nombre.addEventListener('input', ()=>{ if(!editadoAMano){ cert.value = nombre.value; pintar(); } });
}

const TAMANO_MAX_ARCHIVO = 8 * 1024 * 1024;
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    if(file.size > TAMANO_MAX_ARCHIVO){ reject(new Error(`El archivo "${file.name}" pesa demasiado (${(file.size/1024/1024).toFixed(1)}MB). Máximo 8MB.`)); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error(`No se pudo leer el archivo "${file.name}". Intenta con otra foto.`));
    reader.readAsDataURL(file);
  });
}

async function enviarRegistro(conCert, conPago){
  const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const data = {
    nombre: v('f_nombre'), correo: v('f_correo'), pais: v('f_pais'), telefono: v('f_telefono'),
    ciudad: v('f_ciudad'), profesion: v('f_profesion'), nombreCertificado: conCert ? v('f_certificado') : '',
    metodoPago:'', cuentaDestino:'', referenciaPago:'', autorizoDatos:true, archivos:{}
  };
  if(!data.nombre || !data.correo || !data.pais || !data.telefono || !data.ciudad || !data.profesion || (conCert && !data.nombreCertificado)){
    showToast('Por favor completa todos los campos marcados con *.'); return;
  }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.correo)){ showToast('Revisa tu correo: parece que no está bien escrito.'); return; }

  let fileComprobante = null;
  if(conPago){
    data.metodoPago = v('f_metodo_pago');
    data.cuentaDestino = document.getElementById('f_cuenta_destino_wrap').style.display !== 'none' ? v('f_cuenta_destino') : '';
    data.referenciaPago = v('f_referencia_pago');
    fileComprobante = document.getElementById('f_file_comprobante').files[0];
    if(!data.metodoPago){ showToast('Selecciona tu método de pago.'); return; }
    if((data.metodoPago==='Transferencia Bancaria'||data.metodoPago==='Depósito') && !data.cuentaDestino){ showToast('Selecciona a cuál cuenta transferiste o depositaste.'); return; }
    if(!fileComprobante){ showToast('El comprobante de pago es obligatorio.'); return; }
  }
  if(!document.getElementById('f_autorizo').checked){ showToast('Debes autorizar el uso de tus datos personales para continuar.'); return; }

  const btn = document.getElementById('btn_enviar');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try{
    if(fileComprobante) data.archivos.comprobante = {data: await fileToBase64(fileComprobante), name: fileComprobante.name, mimeType: fileComprobante.type||'application/octet-stream'};
    const json = await api({ action:'registrarMasterclass', id: MC_ID, data });
    if(json && json.error) throw new Error(json.error);
    if(json && json.duplicado) document.getElementById('success_msg').textContent = 'Ya estabas registrado en esta masterclass; actualizamos tus datos.' + (conCert ? ' Te enviaremos tu certificado al correo que registraste.' : '');
    document.getElementById('form_box').style.display = 'none';
    document.getElementById('success_box').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
  }catch(e){
    showToast('Hubo un problema al enviar: ' + ((e && e.message) || 'error inesperado.'));
    btn.disabled = false; btn.textContent = 'Registrarme';
  }
}

/* =========================================================================
   PANEL ADMIN  (masterclass.html sin ?id)
   ========================================================================= */
let CLAVE = '';
try{ CLAVE = sessionStorage.getItem('mc_clave') || ''; }catch(e){}
let TAB = 'lista';
let EVENTOS = [];

async function iniciarAdmin(){
  document.title = 'Ceprocenter · Masterclass';
  $app.classList.add('ancho');
  if(!CLAVE) return renderLogin();
  $app.innerHTML = cargando();
  let res;
  try{ res = await api({ action:'listarMasterclass', clave: CLAVE }); }catch(e){ res = { error:'Sin conexión.' }; }
  if(res.error){ CLAVE=''; try{ sessionStorage.removeItem('mc_clave'); }catch(e){} return renderLogin(res.error); }
  EVENTOS = res.masterclass || [];
  renderAdmin();
}

function renderLogin(error){
  $app.innerHTML = `<div class="panel" style="max-width:420px;margin:60px auto 0">
    ${logo()}<h1 style="text-align:center;font-size:21px;margin:0 0 6px">Masterclass</h1>
    <p style="text-align:center;color:var(--text-dim);font-size:13.5px;margin:0 0 18px">Panel interno. Ingresa la clave de administración.</p>
    <div class="field"><label for="clave">Clave</label><input id="clave" type="password" autocomplete="current-password"></div>
    ${error?`<div class="msg err">${esc(error)}</div>`:''}
    <button class="btn" id="btnLogin">Entrar</button></div>`;
  const go = ()=>{ CLAVE = document.getElementById('clave').value; try{ sessionStorage.setItem('mc_clave', CLAVE); }catch(e){} iniciarAdmin(); };
  document.getElementById('btnLogin').onclick = go;
  document.getElementById('clave').onkeydown = ev=>{ if(ev.key==='Enter') go(); };
}

function renderAdmin(){
  $app.innerHTML = `
    <div class="top" style="text-align:left;margin-bottom:0">
      <h1>Masterclass <span class="accent">Ceprocenter</span></h1>
      <div class="sub">Crea la masterclass, comparte el enlace y revisa quién se registró.</div>
    </div>
    <div class="tabs">
      <button class="tab" data-tab="lista">📋 Mis masterclass</button>
      <button class="tab" data-tab="crear">➕ Crear masterclass</button>
    </div>
    <div id="panel"></div>`;
  $app.querySelectorAll('.tab').forEach(t=>t.onclick = ()=>{ TAB = t.dataset.tab; pintarTab(); });
  pintarTab();
}

function pintarTab(){
  $app.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.tab===TAB));
  if(TAB==='crear') renderCrear(); else renderLista();
}

function renderCrear(){
  const panel = document.getElementById('panel');
  panel.innerHTML = `<div class="panel">
    <div class="field"><label>Nombre de la masterclass <span class="req">*</span></label><input id="c_nombre" placeholder="Así lo verán los asistentes en el formulario"></div>
    <div class="field"><label>Fecha</label><input id="c_fecha" type="date"></div>
    <label class="check"><input type="checkbox" id="c_cert"><span>Entrega certificado<small>El formulario pedirá cómo quieren su nombre en el certificado.</small></span></label>
    <label class="check sub-opcion" id="c_pago_wrap" style="display:none"><input type="checkbox" id="c_pago"><span>El certificado tiene costo<small>El formulario pedirá método de pago y comprobante.</small></span></label>
    <button class="btn" id="btnCrear">Crear y obtener enlace</button>
    <div id="res_crear"></div>
  </div>`;
  const cert = document.getElementById('c_cert');
  cert.onchange = ()=>{ document.getElementById('c_pago_wrap').style.display = cert.checked ? 'flex' : 'none'; if(!cert.checked) document.getElementById('c_pago').checked = false; };
  document.getElementById('btnCrear').onclick = async ()=>{
    const nombre = document.getElementById('c_nombre').value.trim();
    if(!nombre){ showToast('Escribe el nombre de la masterclass.'); return; }
    const data = { nombre, fecha: document.getElementById('c_fecha').value, conCertificado: cert.checked, conPago: cert.checked && document.getElementById('c_pago').checked };
    const btn = document.getElementById('btnCrear');
    btn.disabled = true; btn.textContent = 'Creando...';
    let res;
    try{ res = await api({ action:'crearMasterclass', clave: CLAVE, data }); }catch(e){ res = { error:'Sin conexión.' }; }
    btn.disabled = false; btn.textContent = 'Crear y obtener enlace';
    if(res.error){ document.getElementById('res_crear').innerHTML = `<div class="msg err">${esc(res.error)}</div>`; return; }
    EVENTOS.unshift(res.masterclass);
    const box = document.getElementById('res_crear');
    box.innerHTML = `<div class="msg ok">✔ Masterclass creada. Este es el enlace para compartir:</div>
      <div class="link-box">${esc(linkMasterclass(res.masterclass.id))}</div>${botonesCompartir()}`;
    conectarCompartir(box, res.masterclass);
    document.getElementById('c_nombre').value = ''; document.getElementById('c_fecha').value = '';
    cert.checked = false; cert.onchange();
  };
}

function botonesCompartir(extra){
  return `<div class="acciones">
    <button class="btn sm sec" data-acc="copiar">📋 Copiar enlace</button>
    <button class="btn sm wa" data-acc="wa">WhatsApp</button>
    <button class="btn sm ghost" data-acc="abrir">Ver formulario</button>${extra||''}</div>`;
}

function conectarCompartir(cont, ev){
  const link = linkMasterclass(ev.id);
  cont.querySelector('[data-acc="copiar"]').onclick = async e=>{
    try{ await navigator.clipboard.writeText(link); e.target.textContent = '✔ Copiado'; }catch(_){ prompt('Copia el enlace:', link); }
  };
  cont.querySelector('[data-acc="wa"]').onclick = ()=>{
    const texto = `¡Hola! 👋 Regístrate en la masterclass "${ev.nombre}"${ev.conCertificado?' para recibir tu certificado':''}: ${link} 💚 Equipo Ceprocenter`;
    window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  };
  cont.querySelector('[data-acc="abrir"]').onclick = ()=> window.open(link, '_blank');
}

function renderLista(){
  const panel = document.getElementById('panel');
  if(!EVENTOS.length){
    panel.innerHTML = `<div class="panel centro">Aún no has creado ninguna masterclass.<br><br><button class="btn sm" id="irCrear">➕ Crear la primera</button></div>`;
    document.getElementById('irCrear').onclick = ()=>{ TAB='crear'; pintarTab(); };
    return;
  }
  panel.innerHTML = EVENTOS.map((ev,i)=>`
    <div class="ev ${ev.activa?'':'cerrada'}" data-i="${i}">
      <div class="ev-head">
        <div>
          <div class="ev-nombre">${esc(ev.nombre)}</div>
          <div class="ev-meta">${ev.fecha?esc(fechaBonita(ev.fecha)):'Sin fecha'}</div>
          <div class="badges">
            ${ev.activa?'<span class="badge verde">Registro abierto</span>':'<span class="badge rojo">Registro cerrado</span>'}
            ${ev.conCertificado?'<span class="badge">🎓 Con certificado</span>':'<span class="badge">Sin certificado</span>'}
            ${ev.conPago?'<span class="badge">💳 Certificado con costo</span>':''}
          </div>
        </div>
        <div class="conteo"><b>${ev.inscritos||0}</b><span>registrados</span></div>
      </div>
      ${botonesCompartir(`<button class="btn sm sec" data-acc="inscritos">👥 Ver registrados</button><button class="btn sm ghost" data-acc="estado">${ev.activa?'Cerrar registro':'Reabrir registro'}</button>`)}
      <div class="inscritos-box"></div>
    </div>`).join('');

  panel.querySelectorAll('.ev').forEach(card=>{
    const ev = EVENTOS[+card.dataset.i];
    conectarCompartir(card, ev);
    card.querySelector('[data-acc="estado"]').onclick = async e=>{
      const accion = ev.activa ? 'cerrar' : 'reabrir';
      if(!confirm(`¿Seguro que quieres ${accion} el registro de "${ev.nombre}"?`)) return;
      e.target.disabled = true;
      let res;
      try{ res = await api({ action:'cambiarEstadoMasterclass', clave: CLAVE, id: ev.id, activa: !ev.activa }); }catch(_){ res = { error:'Sin conexión.' }; }
      if(res.error){ showToast(res.error); e.target.disabled = false; return; }
      ev.activa = !ev.activa; renderLista();
    };
    card.querySelector('[data-acc="inscritos"]').onclick = ()=> verInscritos(card, ev);
  });
}

async function verInscritos(card, ev){
  const box = card.querySelector('.inscritos-box');
  if(box.innerHTML){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="centro" style="padding:20px"><div class="spinner"></div></div>`;
  let res;
  try{ res = await api({ action:'inscritosMasterclass', clave: CLAVE, id: ev.id }); }catch(_){ res = { error:'Sin conexión.' }; }
  if(res.error){ box.innerHTML = `<div class="msg err">${esc(res.error)}</div>`; return; }
  const filas = res.inscritos || [];
  if(!filas.length){ box.innerHTML = `<div class="msg ok">Todavía no hay registrados.</div>`; return; }
  const cols = [['nombre','Nombre'],['correo','Correo'],['telefono','Teléfono'],['pais','País'],['ciudad','Ciudad'],['profesion','Profesión']];
  if(ev.conCertificado) cols.push(['nombreCertificado','Nombre en certificado']);
  if(ev.conPago) cols.push(['metodoPago','Pago'],['referenciaPago','Referencia'],['comprobanteUrl','Comprobante']);
  box.innerHTML = `<div class="tabla-wrap"><table>
      <thead><tr><th>#</th>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead>
      <tbody>${filas.map((f,i)=>`<tr><td>${i+1}</td>${cols.map(([k])=> k==='comprobanteUrl' ? `<td>${f[k]?`<a href="${esc(f[k])}" target="_blank">Ver</a>`:''}</td>` : `<td>${esc(f[k])}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <div class="acciones"><button class="btn sm sec" data-acc="csv">⬇️ Descargar lista (Excel/CSV)</button></div>`;
  box.querySelector('[data-acc="csv"]').onclick = ()=>{
    const celda = s => '"' + String(s==null?'':s).replace(/"/g,'""') + '"';
    const csv = '﻿' + [cols.map(c=>celda(c[1])).join(';'), ...filas.map(f=>cols.map(([k])=>celda(f[k])).join(';'))].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    a.download = 'Registrados - ' + ev.nombre.replace(/[\\/:*?"<>|]/g,'') + '.csv';
    a.click();
  };
}

// Arranque: con ?id= es el formulario público; sin ?id= es el panel para crear masterclass.
if(MC_ID) iniciarFormulario(); else iniciarAdmin();
</script>
</body>
</html>
